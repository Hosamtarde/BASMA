name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: i18n catalogs (ar/en parity)
        run: npm run i18n:check

      - name: Unit tests
        run: npm test

      # Testcontainers starts PostgreSQL 16 in Docker (available on ubuntu runners).
      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
