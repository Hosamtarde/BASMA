name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Also builds packages/shared (root "prepare" script).
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/api

      - name: Typecheck
        run: npm run typecheck -w packages/shared && npm run typecheck -w apps/api

      - name: i18n catalogs (ar/en parity)
        run: npm run i18n:check -w apps/api

      - name: Unit tests
        run: npm test -w apps/api

      # Testcontainers starts PostgreSQL 16 in Docker (available on ubuntu runners).
      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build -w packages/shared && npm run build -w apps/api

      - name: Dependency audit
        run: npm audit --audit-level=high

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (incl. no hard-coded text, jsx-a11y)
        run: npm run lint -w apps/web

      - name: Typecheck
        run: npm run typecheck -w apps/web

      - name: i18n catalogs (plural-aware ar/en parity)
        run: npm run i18n:check -w apps/web

      - name: RTL guard (logical properties only)
        run: npm run rtl:check

      - name: Unit and component tests
        run: npm test -w apps/web

      - name: Build
        run: npm run build -w apps/web

      # The committed contract and generated client must match the API code.
      - name: OpenAPI drift check
        run: npm run contract:check

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway CI database (exists only for this job); not a secret.
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab-ci
          POSTGRES_DB: lab_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lab -d lab_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://lab:lab-ci@127.0.0.1:5432/lab_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # The API serves the built UI on one origin, like the installed product (ADR-0017).
      - name: Build API and web
        run: npm run build

      - name: Playwright with axe (both languages)
        run: npm run e2e -w apps/web

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
